name: Build, test and publish container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-ghcr.yml
      - app/**
      - assets/**
      - scripts/**
      - tests/**
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-ghcr.yml
      - app/**
      - assets/**
      - scripts/**
      - tests/**
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional additional image tag
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/music-assistant-skill

jobs:
  build:
    name: Build and test ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Test image
        env:
          TEST_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
        run: >-
          docker run --rm -v "$PWD:/project:ro"
          --entrypoint /bin/sh "$TEST_IMAGE" -c
          '/app/venv/bin/pip -q install pytest && SKILL_APP_PATH=/app/src /app/venv/bin/python -m pytest /project/tests -q -p no:cacheprovider'
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image
        if: github.event_name != 'pull_request'
        env:
          TEST_IMAGE: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.arch }}
        run: docker push "$TEST_IMAGE"

  publish:
    name: Publish multi-architecture tags
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest
        env:
          REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXTRA_TAG: ${{ inputs.image_tag }}
        run: |
          tags=(--tag "$IMAGE:latest" --tag "$IMAGE:sha-$REVISION")
          if [ -n "$RELEASE_TAG" ]; then
            tags+=(--tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:${RELEASE_TAG#v}")
          fi
          if [ -n "$EXTRA_TAG" ]; then tags+=(--tag "$IMAGE:$EXTRA_TAG"); fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-$REVISION-amd64" \
            "$IMAGE:sha-$REVISION-arm64"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign published images
        env:
          REVISION: ${{ github.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-$REVISION" --format '{{.Manifest.Digest}}')"
          cosign sign --yes --recursive "$IMAGE@$digest"
